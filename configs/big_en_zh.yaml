# Transformer Big — WMT17 en-zh

model:
  d_model: 1024
  n_heads: 16
  n_encoder_layers: 6
  n_decoder_layers: 6
  d_ff: 4096
  dropout: 0.3              # stronger regularization for potentially smaller corpus
  max_seq_len: 256
  vocab_size: 32000
  share_embeddings: true

training:
  batch_size: 8192
  max_sentences: 64
  accumulate_steps: 4

  max_steps: 400000
  warmup_steps: 8000
  lr: 0.0007
  lr_scale: 1.5
  min_lr: 1.0e-5

  label_smoothing: 0.1
  clip_grad_norm: 1.0

  fp16: false
  bf16: true

  seed: 42

  save_interval: 10000
  eval_interval: 20000
  eval_interval_min: 3000
  eval_loss_high: 4.0
  eval_loss_low: 2.8
  log_interval: 100

  patience: 10
  early_stopping: true
  min_steps_before_early_stop: 160000
  emergency_save_interval: 500

  loss_spike_ratio: 1.3
  loss_ema_alpha: 0.005

data:
  src_lang: en
  tgt_lang: zh
  train_src: data_enzh/train.clean.en
  train_tgt: data_enzh/train.clean.zh
  valid_src: data_enzh/valid.en
  valid_tgt: data_enzh/valid.zh
  test_src: data_enzh/test.en
  test_tgt: data_enzh/test.zh
  spm_model: data_enzh/spm_enzh.model
  max_tokens: 256
  num_workers: 4

inference:
  beam_size: 5
  length_penalty: 1.0
  max_decode_len: 256

checkpoint:
  dir: checkpoints/big_enzh
  keep_last: 5

logging:
  swanlab:
    enabled: true
    project: wmt-mt
    experiment: big_enzh
    mode: cloud
